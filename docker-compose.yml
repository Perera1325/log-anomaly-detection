services:
  init:                       # prepares data + models once
    build: .
    command: python bootstrap.py
    volumes: &vols
      - ./Data:/app/Data
      - ./Models:/app/Models
      - ./Results:/app/Results

  api:                        # http://localhost:8000/docs
    build: .
    ports: ["8000:8000"]
    env_file: [{path: .env, required: false}]
    volumes: *vols
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s

  dashboard:                  # http://localhost:8501
    build: .
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports: ["8501:8501"]
    volumes: *vols
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped
